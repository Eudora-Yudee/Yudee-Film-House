<!DOCTYPE html>
<html lang="en">
<head>
    <title>Landing Page</title>
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="src/assets/logo.jpeg" alt="an image of popcorn in a bowl with movie tape">
            <h2>Yudee's<br><span>FilmHouse</span></h2>
        </div>
        <ul>
            <li><a href="#">Top Picks</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="#">TV Series</a></li>
            <li><a href="#">Bookmarked</a></li>
        </ul>
        <button>Purchase a Ticket</button>
    </nav>

    <section class="hero-section">
        <div class="hero-content">
            <h1>Top Picks for Movie Lovers</h1>
            <p>Dive into suspense, fantasy, and edge-of-your-seat thrillers, handpicked to move you.</p>
            <button class="explorebutt">Explore Featured</button>
        </div>
    </section>

    <section class="menu-section">
        <h2>Highest Grossing Show of the Week!</h2>
        <div class="cards">
            <div class="featured">
                <img src="src/assets/mvb1.jpeg" alt="an image for family shows">
                <h3>Family Night</h3>
                <button id="fab">View More</button>
            </div>
            <div class="featured">
                <img src="src/assets/Oversabi.jpeg" alt="explore comedy shows here">
                <h3>Comedy World</h3>
                <button id="cob">View More</button>
            </div>
            <div class="featured">
                <img src="src/assets/avatar.jpeg" alt="suspense and on-the-edge movies">
                <h3>Suspense Edge</h3>
                <button id="sub">View More</button>
            </div>
            <div><div class="featured">
                <img src="src/assets/emip.jpeg" alt="Emily in Paris">
                <h3>Romance-Comedy</h3>
                <button id="emb">View More</button></div>
        </div>
    </section>
</body>
</html>
